<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컵라면 UD · 수업 대시보드</title>
<style>
  :root{
    --ink:#1c2637; --ink-2:#4b5668; --ink-3:#6b7687;
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0;
    --blue:#2f6fd0; --green:#1e8f5f; --amber:#c47a08; --red:#c8442f;
    --blue-s:#e9f1fd; --green-s:#e6f5ee; --amber-s:#fdf3e0; --red-s:#fcecea;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px; line-height:1.55;}
  button,input,select{font:inherit;}
  :focus-visible{outline:3px solid var(--blue); outline-offset:2px;}

  /* ───── 설정 화면 ───── */
  #setup{max-width:560px; margin:8vh auto; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:30px 32px 32px;
    box-shadow:0 16px 40px rgba(20,32,50,.08);}
  #setup h1{font-size:25px; margin:0 0 6px; letter-spacing:-.03em;}
  #setup p.sub{margin:0 0 22px; color:var(--ink-2); font-size:14.5px;}
  .fld{margin-bottom:15px;}
  .fld label{display:block; font-size:13.5px; font-weight:700; color:var(--ink-2); margin-bottom:6px;}
  .fld input{width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 12px; font-size:15px; background:#fcfdff;}
  .fld input:focus{outline:none; border-color:var(--blue); background:#fff;}
  .fld .hint{font-size:12.5px; color:var(--ink-3); margin-top:5px;}
  .go{width:100%; margin-top:10px; padding:14px; border:none; border-radius:11px;
    background:var(--blue); color:#fff; font-size:16px; font-weight:800; cursor:pointer;}
  .go:active{transform:translateY(1px);}
  .err{color:var(--red); font-size:13.5px; min-height:1.3em; margin-top:10px;}

  /* ───── 상단 막대 ───── */
  .bar{position:sticky; top:0; z-index:20; display:flex; align-items:center;
    gap:10px; flex-wrap:wrap; padding:11px 16px; background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .bar .ttl{font-weight:800; font-size:16px; letter-spacing:-.02em; white-space:nowrap;}
  .bar select,.bar .btn{border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:7px 11px; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);}
  .bar .btn.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .bar .btn.danger{color:var(--red); border-color:#f0cfc9;}
  .bar .btn.danger.on{background:var(--red); border-color:var(--red); color:#fff;}
  .spacer{flex:1;}
  .clock{font-size:13px; color:var(--ink-3); white-space:nowrap;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--green); margin-right:6px; vertical-align:1px;}
  .dot.off{background:var(--red);}

  /* ───── 요약 ───── */
  .sum{display:flex; gap:10px; flex-wrap:wrap; padding:14px 16px 2px;}
  .kpi{flex:1; min-width:132px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:13px 15px;}
  .kpi b{display:block; font-size:27px; line-height:1.15; letter-spacing:-.02em;}
  .kpi span{font-size:13px; color:var(--ink-3); font-weight:700;}
  .kpi.g b{color:var(--green);} .kpi.a b{color:var(--amber);} .kpi.r b{color:var(--red);}

  /* ───── 학생 카드 ───── */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(188px,1fr));
    gap:12px; padding:14px 16px 40px;}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:15px;
    padding:11px; position:relative; transition:border-color .15s;}
  .card.sub{border-color:#b9e0cd; background:var(--green-s);}
  .card.stall{border-color:#f0d09a; background:var(--amber-s);}
  .card.idle{opacity:.62;}
  .thumb{width:100%; aspect-ratio:1/1.05; border-radius:10px; background:#f7f9fc;
    border:1px solid var(--line); object-fit:contain; display:block;}
  .thumb.none{display:grid; place-items:center; color:#b6bfcc; font-size:12.5px; font-weight:700;}
  .who{display:flex; align-items:baseline; gap:6px; margin-top:9px;}
  .who b{font-size:15px; letter-spacing:-.02em;}
  .who span{font-size:12px; color:var(--ink-3); font-weight:700;}
  .stage{font-size:12.5px; color:var(--ink-2); margin-top:2px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barwrap{height:7px; background:#eef1f6; border-radius:99px; margin-top:8px; overflow:hidden;}
  .barfill{height:100%; background:var(--blue); border-radius:99px; transition:width .4s;}
  .card.sub .barfill{background:var(--green);}
  .meta{display:flex; justify-content:space-between; align-items:center;
    margin-top:6px; font-size:11.5px; color:var(--ink-3); font-weight:700;}
  .tag{position:absolute; top:9px; right:9px; font-size:11px; font-weight:800;
    padding:3px 8px; border-radius:99px; background:var(--green); color:#fff;}
  .tag.stall{background:var(--amber);}
  .empty{padding:60px 20px; text-align:center; color:var(--ink-3);}
  .empty b{display:block; font-size:17px; color:var(--ink-2); margin-bottom:6px;}

  /* ───── 감상 모드 ───── */
  #gal{position:fixed; inset:0; z-index:60; background:#0d1220; color:#fff;
    display:none; flex-direction:column;}
  #gal.on{display:flex;}
  .gbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:13px 20px; border-bottom:1px solid #22304a; background:#101828;}
  .gbar .gt{font-weight:800; font-size:17px; letter-spacing:-.02em;}
  .gbar .gsub{font-size:13px; color:#93a3bd; font-weight:600;}
  .gbar button{border:1px solid #2c3d5c; background:#182338; color:#e7eefb;
    border-radius:9px; padding:8px 13px; font-size:14px; font-weight:700; cursor:pointer;}
  .gbar button.on{background:#3b7fe0; border-color:#3b7fe0; color:#fff;}
  .gbar .sp{flex:1;}
  .ggrid{flex:1; overflow:auto; display:grid; gap:18px; padding:22px 20px 40px;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); align-content:start;}
  .gcard{cursor:zoom-in;}
  .gcard img{width:100%; aspect-ratio:1/1.05; object-fit:contain; background:#fff;
    border-radius:15px; display:block; box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:transform .15s;}
  .gcard:hover img{transform:translateY(-3px);}
  .gname{text-align:center; margin-top:9px; font-size:15px; font-weight:800; letter-spacing:-.02em;}
  .gnum{text-align:center; font-size:12px; color:#8fa0bb; font-weight:700;}
  #gal.anon .gname,#gal.anon .gnum{visibility:hidden;}
  .gempty{grid-column:1/-1; text-align:center; padding:70px 20px; color:#8fa0bb;}
  .gempty b{display:block; font-size:19px; color:#c9d6ec; margin-bottom:8px;}
  #zoom{position:fixed; inset:0; z-index:70; background:rgba(6,10,18,.94);
    display:none; place-items:center; padding:30px; cursor:zoom-out;}
  #zoom.on{display:grid;}
  #zoom img{max-width:min(88vw,900px); max-height:78vh; background:#fff;
    border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #zoom .zn{position:absolute; bottom:34px; left:0; right:0; text-align:center;
    color:#fff; font-size:22px; font-weight:800; letter-spacing:-.02em;}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .bar .ttl{width:100%;}
  }
</style>
</head>
<body>

<!-- ══════════ 설정 ══════════ -->
<div id="setup">
  <h1>컵라면 UD · 수업 대시보드</h1>
  <p class="sub">학생들이 지금 어디까지 했는지 한눈에 봅니다. 처음 한 번만 입력하면 이 기기에 기억됩니다.</p>

  <div class="fld">
    <label for="url">Apps Script 웹 앱 주소</label>
    <input id="url" placeholder="https://script.google.com/macros/s/..../exec" spellcheck="false">
    <div class="hint">활동지 HTML 의 <b>SUBMIT_URL</b> 에 넣은 것과 같은 주소입니다.</div>
  </div>

  <div class="fld">
    <label for="key">선생님 암호</label>
    <input id="key" placeholder="Code.gs 의 TEACHER_KEY 값" spellcheck="false">
    <div class="hint">Code.gs 맨 위 <b>TEACHER_KEY</b> 에 적어 둔 값입니다.</div>
  </div>

  <button class="go" id="start">대시보드 열기</button>
  <div class="err" id="err"></div>
</div>

<!-- ══════════ 대시보드 ══════════ -->
<div id="dash" hidden>
  <div class="bar">
    <span class="ttl">🍜 수업 대시보드</span>
    <select id="cls"><option value="">전체 반</option></select>
    <select id="sort">
      <option value="id">학번순</option>
      <option value="pct">진행률 낮은 순</option>
      <option value="last">멈춘 지 오래된 순</option>
    </select>
    <button class="btn on" id="auto">자동 새로고침 ON</button>
    <button class="btn" id="now">지금 새로고침</button>
    <button class="btn" id="galOpen">🖼 감상 모드</button>
    <span class="spacer"></span>
    <button class="btn danger" id="lock" hidden>이 반 마감하기</button>
    <span class="clock"><span class="dot" id="dot"></span><span id="stamp">연결 중…</span></span>
    <button class="btn" id="out">나가기</button>
  </div>

  <div class="sum">
    <div class="kpi"><b id="kTotal">0</b><span>접속한 학생</span></div>
    <div class="kpi g"><b id="kSub">0</b><span>제출 완료</span></div>
    <div class="kpi a"><b id="kStall">0</b><span>5분 이상 멈춤</span></div>
    <div class="kpi"><b id="kAvg">0%</b><span>평균 진행률</span></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- ══════════ 감상 모드 ══════════ -->
<div id="gal">
  <div class="gbar">
    <span class="gt">🍜 우리 반 컵라면</span>
    <span class="gsub" id="galSub"></span>
    <span class="sp"></span>
    <button id="galAnon">이름 가리기</button>
    <button id="galClose">닫기 (ESC)</button>
  </div>
  <div class="ggrid" id="galGrid"></div>
</div>
<div id="zoom"><img id="zoomImg" alt=""><div class="zn" id="zoomName"></div></div>

<script>
(function(){
"use strict";

var LS="udrDash", STALL=5*60*1000, GONE=20*60*1000, EVERY=15000;
var cfg={url:"",key:""}, timer=null, autoOn=true, data=null, busy=false;
var lastRows=[], galOn=false;

var $=function(id){ return document.getElementById(id); };

/* ───────── 설정 ───────── */
try{
  var saved=JSON.parse(localStorage.getItem(LS)||"{}");
  if(saved.url) $("url").value=saved.url;
  if(saved.key) $("key").value=saved.key;
}catch(e){}

$("start").addEventListener("click",function(){
  var u=$("url").value.trim(), k=$("key").value.trim();
  if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(u)){
    $("err").textContent="주소가 …/exec 로 끝나야 해요. 배포 화면에서 다시 복사해 주세요."; return;
  }
  if(!k){ $("err").textContent="선생님 암호를 입력해 주세요."; return; }
  cfg.url=u; cfg.key=k;
  $("err").textContent="확인 중…";
  load(function(ok,msg){
    if(!ok){ $("err").textContent=msg; return; }
    try{ localStorage.setItem(LS,JSON.stringify(cfg)); }catch(e){}
    $("setup").hidden=true; $("dash").hidden=false;
    startTimer();
  });
});
$("url").addEventListener("keydown",function(e){ if(e.key==="Enter") $("key").focus(); });
$("key").addEventListener("keydown",function(e){ if(e.key==="Enter") $("start").click(); });

$("out").addEventListener("click",function(){
  stopTimer(); $("dash").hidden=true; $("setup").hidden=false; $("err").textContent="";
});

/* ───────── 불러오기 ───────── */
function load(cb){
  if(busy) return;
  busy=true;
  var u=cfg.url+"?action=dashboard&key="+encodeURIComponent(cfg.key)+"&t="+Date.now();
  fetch(u,{method:"GET"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      busy=false;
      if(!d||!d.ok){
        setDot(false);
        if(cb) cb(false, d&&d.error==="key" ? "암호가 맞지 않습니다." : "서버가 응답했지만 내용이 이상합니다.");
        return;
      }
      data=d; setDot(true); render();
      if(cb) cb(true);
    })
    .catch(function(){
      busy=false; setDot(false);
      if(cb) cb(false,"연결하지 못했습니다. 주소가 맞는지, 배포 권한이 ‘모든 사용자’인지 확인해 주세요.");
    });
}

function setDot(ok){
  $("dot").className="dot"+(ok?"":" off");
  $("stamp").textContent=ok?("업데이트 "+hhmm(new Date())):"연결 안 됨";
}

function startTimer(){ stopTimer(); if(autoOn) timer=setInterval(function(){ if(!document.hidden) load(); },EVERY); }
function stopTimer(){ if(timer) clearInterval(timer); timer=null; }

$("auto").addEventListener("click",function(){
  autoOn=!autoOn;
  this.classList.toggle("on",autoOn);
  this.textContent="자동 새로고침 "+(autoOn?"ON":"OFF");
  startTimer();
});
$("now").addEventListener("click",function(){ load(); });
$("cls").addEventListener("change",render);
$("sort").addEventListener("change",render);

/* ───────── 마감 ───────── */
$("lock").addEventListener("click",function(){
  var cls=$("cls").value;
  if(!cls) return;
  var on=!(data.locks&&data.locks[cls]);
  if(!confirm(on ? (cls+" 학생들의 화면을 지금 잠글까요?\n지금까지 그린 것은 그대로 남고, 보기만 가능해집니다.")
                 : (cls+" 마감을 풀까요?"))) return;
  fetch(cfg.url+"?action=lock&key="+encodeURIComponent(cfg.key)
        +"&cls="+encodeURIComponent(cls)+"&on="+(on?"1":"0")+"&t="+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(){ load(); })
    .catch(function(){ alert("마감 설정을 바꾸지 못했어요."); });
});

/* ───────── 그리기 ───────── */
function render(){
  if(!data) return;

  var sel=$("cls");
  if(sel.options.length-1!==data.classes.length){
    var keep=sel.value;
    sel.innerHTML='<option value="">전체 반</option>';
    data.classes.forEach(function(c){
      var o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o);
    });
    sel.value=keep;
  }

  var cls=sel.value;
  var rows=data.rows.filter(function(r){ return !cls||r.cls===cls; });
  var now=data.now||Date.now();

  /* 마감 버튼 */
  var lb=$("lock");
  if(cls){
    lb.hidden=false;
    var locked=!!(data.locks&&data.locks[cls]);
    lb.classList.toggle("on",locked);
    lb.textContent=locked?("🔒 "+cls+" 마감 중 · 풀기"):("이 반 마감하기");
  }else lb.hidden=true;

  /* 요약 */
  var sub=0, stall=0, tot=0;
  rows.forEach(function(r){
    tot+=r.pct;
    if(r.submitted) sub++;
    else if(now-r.last>STALL && now-r.last<GONE) stall++;
  });
  $("kTotal").textContent=rows.length;
  $("kSub").textContent=sub;
  $("kStall").textContent=stall;
  $("kAvg").textContent=(rows.length?Math.round(tot/rows.length):0)+"%";

  /* 정렬 */
  var mode=$("sort").value;
  rows.sort(function(a,b){
    if(mode==="pct")  return a.pct-b.pct || cmp(a.id,b.id);
    if(mode==="last") return a.last-b.last || cmp(a.id,b.id);
    return cmp(a.id,b.id);
  });

  lastRows=rows;
  if(galOn) renderGallery();

  var g=$("grid");
  if(!rows.length){
    g.innerHTML='<div class="empty"><b>아직 접속한 학생이 없어요</b>'
      +'학생이 활동지에서 학번·이름을 넣고 시작하면 여기에 나타납니다.</div>';
    return;
  }

  g.innerHTML="";
  rows.forEach(function(r){
    var gap=now-r.last;
    var isStall=!r.submitted && gap>STALL && gap<GONE;
    var isIdle=gap>=GONE;

    var c=document.createElement("div");
    c.className="card"+(r.submitted?" sub":"")+(isStall?" stall":"")+(isIdle?" idle":"");

    if(r.thumb){
      var im=document.createElement("img");
      im.className="thumb"; im.src=r.thumb; im.alt=r.name+" 작업 미리보기"; im.loading="lazy";
      c.appendChild(im);
    }else{
      var nd=document.createElement("div");
      nd.className="thumb none"; nd.textContent="아직 그림 없음";
      c.appendChild(nd);
    }

    if(r.submitted){
      var t=document.createElement("span"); t.className="tag"; t.textContent="제출"; c.appendChild(t);
    }else if(isStall){
      var t2=document.createElement("span"); t2.className="tag stall"; t2.textContent="멈춤"; c.appendChild(t2);
    }

    var who=document.createElement("div"); who.className="who";
    var nb=document.createElement("b"); nb.textContent=r.name||"(이름 없음)";
    var ns=document.createElement("span"); ns.textContent=r.id;
    who.appendChild(nb); who.appendChild(ns); c.appendChild(who);

    var st=document.createElement("div"); st.className="stage";
    st.textContent=r.submitted?"제출 완료":(r.stage||"시작함");
    c.appendChild(st);

    var bw=document.createElement("div"); bw.className="barwrap";
    var bf=document.createElement("div"); bf.className="barfill";
    bf.style.width=Math.max(2,Math.min(100,r.pct))+"%";
    bw.appendChild(bf); c.appendChild(bw);

    var m=document.createElement("div"); m.className="meta";
    var m1=document.createElement("span"); m1.textContent=r.pct+"%";
    var m2=document.createElement("span"); m2.textContent=ago(gap);
    m.appendChild(m1); m.appendChild(m2); c.appendChild(m);

    g.appendChild(c);
  });
}

/* ───────── 감상 모드 ───────── */
function openGal(){
  galOn=true; $("gal").classList.add("on"); renderGallery();
}
function closeGal(){
  galOn=false; $("gal").classList.remove("on"); $("zoom").classList.remove("on");
}
function renderGallery(){
  var cls=$("cls").value;
  var list=lastRows.filter(function(r){ return r.thumb; });
  $("galSub").textContent=(cls||"전체")+" · "+list.length+"명";

  var g=$("galGrid");
  g.innerHTML="";
  if(!list.length){
    g.innerHTML='<div class="gempty"><b>아직 보여줄 작품이 없어요</b>'
      +'학생들이 그리기 시작하면 여기에 하나씩 올라옵니다.</div>';
    return;
  }
  list.forEach(function(r){
    var c=document.createElement("div"); c.className="gcard";
    var im=document.createElement("img");
    im.src=r.thumb; im.alt=r.name+" 작품"; im.loading="lazy";
    var nm=document.createElement("div"); nm.className="gname"; nm.textContent=r.name||"(이름 없음)";
    var no=document.createElement("div"); no.className="gnum"; no.textContent=r.id;
    c.appendChild(im); c.appendChild(nm); c.appendChild(no);
    c.addEventListener("click",function(){
      $("zoomImg").src=r.thumb;
      $("zoomName").textContent=$("gal").classList.contains("anon")?"":((r.name||"")+"  "+r.id);
      $("zoom").classList.add("on");
    });
    g.appendChild(c);
  });
}
$("galOpen").addEventListener("click",openGal);
$("galClose").addEventListener("click",closeGal);
$("galAnon").addEventListener("click",function(){
  var on=$("gal").classList.toggle("anon");
  this.classList.toggle("on",on);
  this.textContent=on?"이름 보이기":"이름 가리기";
});
$("zoom").addEventListener("click",function(){ this.classList.remove("on"); });
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if($("zoom").classList.contains("on")) $("zoom").classList.remove("on");
  else if(galOn) closeGal();
});

/* ───────── 잔손질 ───────── */
function cmp(a,b){ return String(a).localeCompare(String(b),"ko",{numeric:true}); }
function hhmm(d){
  return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
}
function ago(ms){
  if(!ms||ms<0) return "—";
  var s=Math.floor(ms/1000);
  if(s<60) return "방금";
  var m=Math.floor(s/60);
  if(m<60) return m+"분 전";
  return Math.floor(m/60)+"시간 전";
}

document.addEventListener("visibilitychange",function(){ if(!document.hidden && !$("dash").hidden) load(); });
})();
</script>
